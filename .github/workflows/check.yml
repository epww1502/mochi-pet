# 태그 없이 브랜치에 push하면 배포하지 않고 검사만 한다: 테스트 + 맥·윈도우에서 Rust 컴파일.
# 이 컴퓨터에 Rust가 없어도 배포 전에 컴파일 오류를 잡을 수 있다.
name: check

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p .
      - run: npm run build # cargo가 dist를 찾으므로 먼저 만든다
      - run: cargo test --manifest-path src-tauri/Cargo.toml
