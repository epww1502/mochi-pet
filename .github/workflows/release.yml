# v로 시작하는 태그를 push하면 맥(Apple Silicon/Intel)과 윈도우 실행 파일을 Releases에 올린다.
# Tauri 실행 파일은 화면(React)을 안에 담고 있어서 파일 하나로 실행된다(--no-bundle).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - if: matrix.test
        run: npm test
      - run: npx tauri build --no-bundle --target ${{ matrix.target }}
      - if: matrix.test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: package
        shell: bash
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$GITHUB_WORKSPACE/mochi-pet-${{ matrix.target }}.zip" mochi-pet.exe
          else
            tar czf "$GITHUB_WORKSPACE/mochi-pet-${{ matrix.target }}.tar.gz" mochi-pet
          fi
      - name: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 세 작업 중 먼저 온 쪽이 릴리스를 만들고, 나머지는 이미 있으니 넘어간다.
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" mochi-pet-${{ matrix.target }}.* --clobber
