# v로 시작하는 태그를 push하면 맥 .dmg(Apple Silicon/Intel)와 윈도우 설치 파일을 만든다.
# 1) build: 세 빌드가 각자 "초안" 릴리스에 파일을 올린다 (초안은 아직 아무도 못 받는다)
# 2) publish: 셋 다 성공했을 때만 자동 업데이트용 latest.json을 만들고 릴리스를 공개한다
#    → 하나라도 실패하면 공개하지 않으니, releases/latest 링크는 마지막으로 성공한 버전을 계속 가리킨다.
# 파일 이름이 버전과 상관없이 같아서 releases/latest/download/<이름> 링크가 항상 최신을 가리킨다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundle: "app,dmg", name: mac-apple-silicon, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, bundle: "app,dmg", name: mac-intel, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundle: nsis, name: windows, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: rustup target add ${{ matrix.target }}
      # Rust 컴파일 결과를 저장해 두고 다음 배포 때 다시 쓴다 (매번 처음부터 빌드하던 4~5분을 줄인다)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - if: matrix.test
        run: npm test
      # 맥: 저장소 Secrets에 Apple 인증서·API 키가 있으면 서명하고 공증까지 받는다.
      # 없으면 임시(애드혹) 서명만 한다 (tauri.conf.json의 signingIdentity "-").
      - name: Apple 서명·공증 준비
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Developer ID로 서명합니다"
          else
            echo "::warning::Apple 인증서가 없어 임시 서명만 합니다 (공증 없음)"
          fi
          if [ -n "$API_KEY_P8" ] && [ -n "$API_KEY" ] && [ -n "$API_ISSUER" ]; then
            printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY=$API_KEY"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            } >> "$GITHUB_ENV"
            echo "공증을 받습니다"
          fi
      # 자동 업데이트 파일 서명 키가 있으면 업데이트 파일(.sig)도 만든다. 없으면 업데이트 파일 없이 빌드.
      - name: 업데이트 서명 준비
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "업데이트 파일을 서명합니다"
          else
            echo "::warning::업데이트 서명 키가 없어 자동 업데이트 파일을 만들지 않습니다"
            echo 'NO_UPDATER=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi
      - name: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} $NO_UPDATER
      # 받는 파일은 dmg라서 dmg도 공증받고 확인서를 붙인다(stapling). 안의 앱은 위 빌드에서 이미 공증됐다.
      - name: dmg 공증·확인
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        run: |
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          codesign -dv "$mnt"/*.app 2>&1 | grep -E "Authority=Developer ID|TeamIdentifier"
          spctl -a -vv -t exec "$mnt"/*.app
          hdiutil detach "$mnt" >/dev/null
      - if: matrix.test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: package
        shell: bash
        run: |
          out="src-tauri/target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$out"/bundle/nsis/*-setup.exe "mochi-pet-windows-setup.exe"
            for sig in "$out"/bundle/nsis/*-setup.exe.sig; do [ -f "$sig" ] && cp "$sig" "mochi-pet-windows-setup.exe.sig"; done
            7z a "mochi-pet-${{ matrix.target }}.zip" "./$out/mochi-pet.exe"
          else
            cp "$out"/bundle/dmg/*.dmg "mochi-pet-${{ matrix.name }}.dmg"
            for t in "$out"/bundle/macos/*.app.tar.gz; do [ -f "$t" ] && cp "$t" "mochi-pet-${{ matrix.name }}.app.tar.gz"; done
            for sig in "$out"/bundle/macos/*.app.tar.gz.sig; do [ -f "$sig" ] && cp "$sig" "mochi-pet-${{ matrix.name }}.app.tar.gz.sig"; done
            tar czf "mochi-pet-${{ matrix.target }}.tar.gz" -C "$out" mochi-pet
          fi
          ls -l mochi-pet-*
      - name: upload (초안)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 세 작업 중 먼저 온 쪽이 초안 릴리스를 만들고, 나머지는 이미 있으니 넘어간다.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" mochi-pet-* --clobber

  publish:
    needs: build # 세 빌드가 모두 성공해야 실행된다
    runs-on: ubuntu-latest
    steps:
      - name: latest.json 만들고 공개
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          base="https://github.com/$REPO/releases/download/$tag"
          mkdir sigs
          gh release download "$tag" -R "$REPO" -p "*.sig" -D sigs || true
          sig() { [ -f "sigs/$1.sig" ] && cat "sigs/$1.sig" || true; }
          mac_arm=$(sig mochi-pet-mac-apple-silicon.app.tar.gz)
          mac_intel=$(sig mochi-pet-mac-intel.app.tar.gz)
          win=$(sig mochi-pet-windows-setup.exe)
          if [ -n "$mac_arm" ] && [ -n "$mac_intel" ] && [ -n "$win" ]; then
            jq -n --arg v "${tag#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg base "$base" \
              --arg a "$mac_arm" --arg i "$mac_intel" --arg w "$win" '{
                version: $v, notes: "새 버전이 나왔어요", pub_date: $d,
                platforms: {
                  "darwin-aarch64": { signature: $a, url: ($base + "/mochi-pet-mac-apple-silicon.app.tar.gz") },
                  "darwin-x86_64":  { signature: $i, url: ($base + "/mochi-pet-mac-intel.app.tar.gz") },
                  "windows-x86_64": { signature: $w, url: ($base + "/mochi-pet-windows-setup.exe") }
                }
              }' > latest.json
            cat latest.json
            gh release upload "$tag" -R "$REPO" latest.json --clobber
          else
            echo "::warning::업데이트 서명 파일이 없어 latest.json을 만들지 않습니다 (자동 업데이트 없음)"
          fi
          gh release edit "$tag" -R "$REPO" --draft=false --latest
